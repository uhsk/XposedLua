[versions]
compile     = '35'
minSdk      = '21'

[libraries]
#
# androidx & kotlin
#
androidx-core       = 'androidx.core:core-ktx:1.15.0'
androidx-appcompat  = 'androidx.appcompat:appcompat:1.7.1'
kotlin-coroutines   = 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
kotlin-extension    = 'com.github.uhsk:kotlin-android-extension:develop-SNAPSHOT'

#
# slf4j
#
slf4j-api       = 'org.slf4j:slf4j-api:2.0.17'
slf4j-logback   = 'com.github.tony19:logback-android:3.0.0'

#
# koin
#
koin-android = 'io.insert-koin:koin-android:4.1.1'
koin-compat  = 'io.insert-koin:koin-android-compat:4.1.1'

#
# commons
#
common-lua      = 'org.luaj:luaj-jse:3.0.1'
common-gson     = 'com.google.code.gson:gson:2.13.2'
common-guava    = 'com.google.guava:guava:33.5.0-android'
common-joor     = 'org.jooq:joor-java-8:0.9.15'                                 # https://github.com/jOOQ/jOOR
common-xposed   = 'com.wind.xposed:xposed-api-lib:0.1.3'

[bundles]
slf4j   = ['slf4j-api', 'slf4j-logback']
koin    = ['koin-android', 'koin-compat']
